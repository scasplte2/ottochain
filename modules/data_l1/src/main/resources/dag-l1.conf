state-after-joining = Ready

# Custom: Single-node consensus for dev/test deployments
consensus {
  peers-count = 1
  tips-count = 1
  timeout = 45 seconds
  pull-txs-count = 100
}

data-consensus {
  # peers-count is facilitators-besides-self per data round. With N DL1 nodes set this to N-1 so EVERY round
  # includes ALL nodes — otherwise a node left out of a round keeps its copy of an applied update, which goes
  # stale and poisons later blocks (a single Invalid tx fails the whole block; see Validator.scala notes).
  peers-count = 1
  peers-count = ${?DATA_PEERS_COUNT}
  timeout = 10 seconds
  max-data-updates-to-dequeue = 50
}

swap {
  peers-count = 1
  timeout = 10 seconds
  max-allow-spends-to-dequeue = 50
}

token-lock {
  peers-count = 1
  timeout = 10 seconds
  max-token-locks-to-dequeue = 50
}

transaction-limit {
  base-balance = 100000000
  time-trigger-interval = 43 seconds
  time-to-wait-for-base-balance = 20 hours
  min-fee-without-limit = 200000
}
