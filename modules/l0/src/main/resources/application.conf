webhook {
  # Default-on so the snapshot.finalized / transaction.rejected dispatcher is always constructed
  # (Main.scala builds the delivery client only when this is set). It is a pure feature-flag —
  # deliveries target each subscriber's own callbackUrl, not this value — and with no subscribers the
  # dispatch is a no-op, so it is safe to leave on in production. WEBHOOK_URL still overrides.
  url = "enabled"
  url = ${?WEBHOOK_URL}
  metagraph-id = ${?CL_L0_TOKEN_IDENTIFIER}
}

genesis {
  path = ${?GENESIS_STATE_PATH}
}
