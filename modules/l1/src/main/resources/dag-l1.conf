state-after-joining = Ready

# Currency-L1 block consensus (the transaction block-formation round that packs mempool
# currency txs into blocks and pushes them to ML0). Without this file the CL1 inherited
# Tessellation's base dag-l1.conf and its block-consensus daemon never produced a usable
# block, so nothing propagated to ML0 (the CL1 only validated txs into its mempool).
#
# Two parameters matter and they are NOT the same as the DL1's:
#  - peers-count: facilitators-besides-self per round. Keep at 1 so a round can start whenever
#    at least one other peer is Ready (robust on a CPU-starved CI cluster). canStartOwnConsensus
#    (dag-l1 Validator) gates round start on this plus enough tips plus a pending tx.
#  - tips-count: how many parent tips the owner selects for the block. A DAG/currency block is
#    INVALID unless it references >= minParentCount = 2 parents (BlockValidator NotEnoughParents;
#    DAGBlockGenerator rejects < 2). tips-count MUST be 2 — a 1-tip block is created then cancelled
#    with CreatedInvalidBlock. (The DL1 sets tips-count=1 harmlessly: it forms data blocks, never
#    tx blocks, so that value is never validated against the 2-parent rule.) Genesis seeds 8 active
#    tips, so getTips(2) is satisfied.
consensus {
  peers-count = 1
  tips-count = 2
  timeout = 45 seconds
  pull-txs-count = 100
}

data-consensus {
  peers-count = 1
  peers-count = ${?DATA_PEERS_COUNT}
  timeout = 10 seconds
  max-data-updates-to-dequeue = 50
}

swap {
  peers-count = 1
  timeout = 10 seconds
  max-allow-spends-to-dequeue = 50
}

token-lock {
  peers-count = 1
  timeout = 10 seconds
  max-token-locks-to-dequeue = 50
}

transaction-limit {
  base-balance = 100000000
  # Idle empty-block cadence for the currency L1. Once tx pressure is flowing the L1 forms
  # blocks on the ~5s OwnRoundTrigger instead, so this only governs the quiescent fallback.
  time-trigger-interval = 43 seconds
  time-trigger-interval = ${?DATA_L1_TIME_TRIGGER_INTERVAL}
  time-to-wait-for-base-balance = 20 hours
  min-fee-without-limit = 200000
}
