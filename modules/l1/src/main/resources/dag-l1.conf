state-after-joining = Ready

# Currency-L1 block consensus (the transaction block-formation round that packs mempool
# currency txs into blocks and pushes them to ML0). Tessellation's base dag-l1.conf defaults
# these to 2/2, sized for a many-node hypergraph. On a 3-node CI metagraph that gate is
# unsatisfiable in practice: `canStartOwnConsensus` (see dag-l1 Validator) requires
#   - peers-count responsive+Ready peers at every 5s tick, AND
#   - tips-count active tips,
# and with peers-count=2 the round never starts on a CPU-starved cluster whose Ready-state
# gossip lags. The result is a CL1 that validates txs into its mempool but forms ZERO blocks,
# so nothing ever propagates to ML0. Match the DL1's small-cluster tuning (peers-count=1,
# tips-count=1): a round needs only one other Ready peer and one of the 8 genesis-seeded tips.
consensus {
  peers-count = 1
  tips-count = 1
  timeout = 45 seconds
  pull-txs-count = 100
}

data-consensus {
  peers-count = 1
  peers-count = ${?DATA_PEERS_COUNT}
  timeout = 10 seconds
  max-data-updates-to-dequeue = 50
}

swap {
  peers-count = 1
  timeout = 10 seconds
  max-allow-spends-to-dequeue = 50
}

token-lock {
  peers-count = 1
  timeout = 10 seconds
  max-token-locks-to-dequeue = 50
}

transaction-limit {
  base-balance = 100000000
  # Idle empty-block cadence for the currency L1. Once tx pressure is flowing the L1 forms
  # blocks on the ~5s OwnRoundTrigger instead, so this only governs the quiescent fallback.
  time-trigger-interval = 43 seconds
  time-trigger-interval = ${?DATA_L1_TIME_TRIGGER_INTERVAL}
  time-to-wait-for-base-balance = 20 hours
  min-fee-without-limit = 200000
}
