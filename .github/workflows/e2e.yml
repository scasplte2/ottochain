name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly at 07:00 UTC — runs the full lane set, including the heavy riverdale-economy e2e.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      tessellation_version:
        description: 'Tessellation version override (e.g., v4.0.0-rc.6)'
        required: false
        type: string

jobs:
  # Select which e2e lanes run. The 5 fast/medium lanes gate every PR; the heavy gated lanes —
  # riverdale-economy (full 6-party economy, REAL asset custody, ~30-55m) and riverdale-health
  # (ZK medical privacy: groth16_verify/sigma_verify THRESHOLD/ring-nullifier guards, ~40m) — are
  # included ONLY on the nightly schedule, on push to main (post-merge safety net), on manual
  # dispatch, or when a PR carries their opt-in label ('e2e-riverdale' / 'e2e-health'). This keeps
  # PR feedback fast without letting the heavy paths drift between merges.
  prepare:
    name: Select e2e lanes
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Empty/false on non-PR events; the event check below covers schedule/push/dispatch.
          RIVERDALE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-riverdale') }}
          HEALTH_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-health') }}
        run: |
          # Canonical lane set. Per-lane rationale (kept from the previous static matrix):
          #   core           light examples, full parallelism — the primary green signal.
          #   tictactoe      own cluster; read-lag canary (~9 sequential moves per flow).
          #   sigma-mixer    gas-heavy sigma_verify; concurrency 2 stresses the chain keepalive.
          #   rule110        light per-step; concurrency 3 is the intra-lane contention probe.
          #   staked-oracle  quorum-3 pool; webhook-confirmed; needs 3 distinct joiners.
          #   riverdale-economy  full 6-party economy, REAL asset custody + multi-fiber — the HEAVY lane.
          #     Highest confirm budget (ordinalThreshold 30 × maxResubmits 4 = 150 ordinals): at its
          #     deepest cross-fiber contention point a VALID transition can be excluded from every DL1
          #     block by one trailing DL1 node (no apply, no reject — "not included") until it catches
          #     up. Observed twice on run 28912533047; result=VALID at all DL1 nodes, zero ML0
          #     rejections — a block-inclusion timing issue, not a validation bug. The wide window rides it out.
          ALL="$(cat <<'JSON'
          [
            {"name":"core","filter":"--exclude sigma-mixer,rule110,staked-oracle-pool,tictactoe,riverdale-economy,riverdale-health","concurrency":"","ordinalThreshold":"","maxResubmits":"","wallets":"","timeout":30},
            {"name":"tictactoe","filter":"--only tictactoe","concurrency":"","ordinalThreshold":"","maxResubmits":"","wallets":"","timeout":30},
            {"name":"sigma-mixer","filter":"--only sigma-mixer","concurrency":"2","ordinalThreshold":"10","maxResubmits":"4","wallets":"","timeout":25},
            {"name":"rule110","filter":"--only rule110","concurrency":"3","ordinalThreshold":"10","maxResubmits":"4","wallets":"","timeout":30},
            {"name":"staked-oracle","filter":"--only staked-oracle-pool","concurrency":"1","ordinalThreshold":"30","maxResubmits":"1","wallets":"alice,bob,carol","timeout":45},
            {"name":"riverdale-economy","filter":"--only riverdale-economy","concurrency":"1","ordinalThreshold":"30","maxResubmits":"4","wallets":"alice,bob,carol,dave,erin,frank","timeout":55},
            {"name":"riverdale-health","filter":"--only riverdale-health","concurrency":"1","ordinalThreshold":"30","maxResubmits":"4","wallets":"dr-adams,patient-blake,pharmacy-corner,pharmacy-mainst,auditor-dea","timeout":40}
          ]
          JSON
          )"
          # ── SOP GUARD (enforced, not advisory) ─────────────────────────────────
          # ADDING A NEW E2E LANE? Its example dir MUST also be added to core's
          # --exclude list above. The core lane auto-discovers EVERY example not
          # excluded and runs it with the default single wallet and full
          # parallelism — a lane that needs its own wallets/limits/label will
          # fail there (e.g. riverdale-health: 'signer patient-blake is not in
          # the --wallets set', run 29463754811). This check fails the workflow
          # at selection time so the mistake never reaches a cluster.
          CORE_EXCLUDE="$(echo "$ALL" | jq -r '.[] | select(.name=="core") | .filter' | sed 's/^--exclude //')"
          MISSING=""
          for dir in $(echo "$ALL" | jq -r '.[] | select(.name!="core") | .filter' | grep -oP '(?<=--only )\S+'); do
            case ",${CORE_EXCLUDE}," in
              *",${dir},"*) ;;
              *) MISSING="${MISSING} ${dir}" ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Lane example dir(s)${MISSING} are missing from the core lane's --exclude list. Every dedicated lane's example must be excluded from core (see SOP GUARD comment in e2e.yml)."
            exit 1
          fi
          echo "SOP guard: all dedicated lanes are excluded from core."
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LANES="$(echo "$ALL" | jq -c '.')"
            echo "Including the heavy gated lanes (event=$EVENT_NAME): riverdale-economy + riverdale-health."
          else
            # PR run: gated lanes join only via their opt-in labels.
            LANES="$(echo "$ALL" | jq -c \
              --argjson riv "${RIVERDALE_LABEL:-false}" \
              --argjson health "${HEALTH_LABEL:-false}" \
              '[.[] | select(
                 (.name == "riverdale-economy" and ($riv | not)) or
                 (.name == "riverdale-health" and ($health | not))
                 | not)]')"
            echo "PR run: fast lanes + gated lanes by label (e2e-riverdale=$RIVERDALE_LABEL, e2e-health=$HEALTH_LABEL)."
          fi
          echo "lanes=$LANES" >>"$GITHUB_OUTPUT"
          echo "Selected lanes:"; echo "$LANES" | jq -r '.[].name'

  # Lightweight, cluster-free gate: type-check the e2e harness against the PUBLISHED @ottochain/sdk.
  # The harness runs under tsx (which erases types), so without this a drift between the SDK's export
  # surface and the harness (e.g. a renamed/removed type) would silently pass CI and only bite a user.
  # This is the circular-dep guard: an SDK change that breaks the harness's contract fails here.
  typecheck:
    name: E2E Typecheck (published SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install E2E dependencies
        working-directory: e2e-test
        run: npm ci
      - name: Type-check harness against @ottochain/sdk
        working-directory: e2e-test
        run: npm run typecheck

  e2e:
    name: E2E Tests (${{ matrix.lane.name }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.lane.timeout }}
    strategy:
      # Lanes are computed by the `prepare` job (above) so the heavy riverdale-economy lane can be
      # gated off ordinary PRs. Each lane is its own job/cluster; fail-fast: false so one lane's
      # failure isn't fatal to the others.
      fail-fast: false
      matrix:
        lane: ${{ fromJson(needs.prepare.outputs.lanes) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install just
        uses: extractions/setup-just@v4

      # Resolve tessellation version from the dependency chain:
      #   ottochain → metakit (version in Dependencies.scala)
      #   metakit POM on Maven Central → tessellation-sdk version
      - name: Resolve tessellation version
        id: versions
        run: |
          METAKIT_VER=$(grep 'val metakit =' project/Dependencies.scala | head -1 | grep -o '"[^"]*"' | tr -d '"')
          echo "metakit=${METAKIT_VER}" >> $GITHUB_OUTPUT

          # Allow workflow_dispatch override
          if [ -n "${{ inputs.tessellation_version }}" ]; then
            TESS_VER="${{ inputs.tessellation_version }}"
            TESS_VER="${TESS_VER#v}"
            echo "Dependency chain: ottochain → metakit ${METAKIT_VER} → tessellation ${TESS_VER} (override)"
          else
            # tessellation-sdk version straight from the metakit POM on Maven Central.
            TESS_VER=$(curl -sf "https://repo1.maven.org/maven2/io/constellationnetwork/metakit_2.13/${METAKIT_VER}/metakit_2.13-${METAKIT_VER}.pom" \
              | grep -A1 'tessellation-sdk' | grep '<version>' | grep -o '[0-9][^<]*' | head -1)
            echo "Dependency chain: ottochain → metakit ${METAKIT_VER} → tessellation ${TESS_VER}"
          fi

          # TEMPORARY PATCH: metakit may point at a tessellation version (e.g. 4.0.0 final) that has no
          # published GitHub release JARs yet, only the Maven-published SDK library. If the resolved
          # version has no release, fall back to the latest published release of the same major.minor so
          # the cluster can still fetch runnable gl0/gl1 JARs. Remove once versions/published artifacts
          # are realigned across repos (or pin explicitly via the tessellation_version input).
          if ! curl -sf "https://api.github.com/repos/Constellation-Labs/tessellation/releases/tags/v${TESS_VER}" >/dev/null 2>&1; then
            MM=$(echo "$TESS_VER" | grep -oE '^[0-9]+\.[0-9]+')
            FALLBACK=$(curl -sf "https://api.github.com/repos/Constellation-Labs/tessellation/releases?per_page=50" \
              | grep -oE '"tag_name": *"v[^"]+"' | grep -oE 'v[0-9][^"]*' | sed 's/^v//' \
              | grep "^${MM}\\." | sort -V | tail -1)
            echo "::warning::tessellation v${TESS_VER} has no published release; falling back to latest published ${MM}.x release: ${FALLBACK}"
            TESS_VER="${FALLBACK}"
          fi
          echo "tessellation=${TESS_VER}" >> $GITHUB_OUTPUT

          # Compute the release TAG to fetch — the v4.0.0 → rc.10 asset-availability mapping lives here so
          # the JAR cache key (below) matches exactly what is downloaded.
          TESS_TAG="v${TESS_VER}"
          [ "$TESS_TAG" = "v4.0.0" ] && TESS_TAG="v4.0.0-rc.10"
          echo "tess_tag=${TESS_TAG}" >> $GITHUB_OUTPUT

      # Clone tessellation develop for Docker infrastructure (compose-runner, Dockerfiles, scripts).
      # Develop has the latest compose-runner with SKIP_ASSEMBLY support for pre-staged JARs.
      # We do NOT build tessellation — all deps resolve from Maven Central.
      - name: Clone tessellation infrastructure
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/Constellation-Labs/tessellation.git tessellation

      # Cache the pre-built tessellation release JARs — they are immutable per release tag, so fetch them
      # from the GitHub release ONCE and reuse across runs. A cache HIT also makes the lane immune to a
      # transient release-download 404/5xx (the download step is skipped entirely).
      - name: Cache tessellation release JARs
        id: cache-tess-jars
        uses: actions/cache@v6
        with:
          path: tess-jars
          key: tessellation-jars-${{ steps.versions.outputs.tess_tag }}

      # Download pre-built GL0/GL1/keytool/wallet JARs from the tessellation GitHub release (cache MISS only).
      # metakit + tessellation-sdk resolve from Maven Central via sbt — no publishLocal needed.
      - name: Download tessellation release JARs
        if: steps.cache-tess-jars.outputs.cache-hit != 'true'
        run: |
          BASE_URL="https://github.com/Constellation-Labs/tessellation/releases/download/${{ steps.versions.outputs.tess_tag }}"
          mkdir -p tess-jars
          echo "Downloading tessellation JARs from release ${{ steps.versions.outputs.tess_tag }}..."
          declare -A JAR_MAP=(
            ["cl-node.jar"]="gl0.jar"
            ["cl-dag-l1.jar"]="gl1.jar"
            ["cl-keytool.jar"]="keytool.jar"
            ["cl-wallet.jar"]="wallet.jar"
          )
          for release_name in "${!JAR_MAP[@]}"; do
            local_name="${JAR_MAP[$release_name]}"
            echo "  ${release_name} → ${local_name}"
            # --retry + --retry-all-errors rides out a TRANSIENT release-CDN 404/5xx on a cache miss.
            # A cache HIT skips this step entirely; the warm-tess-cache workflow keeps main's cache
            # populated so PRs hit and never reach this download at all.
            curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors --retry-max-time 120 \
              -o "tess-jars/${local_name}" "${BASE_URL}/${release_name}"
            echo "    ✓ $(stat -c%s "tess-jars/${local_name}") bytes"
          done

      # Stage the (cached or freshly-downloaded) tessellation JARs into the compose-runner jars dir.
      - name: Stage tessellation JARs
        run: |
          mkdir -p tessellation/docker/jars
          cp tess-jars/*.jar tessellation/docker/jars/
          ls -la tessellation/docker/jars

      # Only build ottochain metagraph JARs from source.
      # metakit + tessellation-sdk are resolved from Maven Central.
      - name: Build metagraph JARs
        run: sbt --error "currencyL0/assembly" "currencyL1/assembly" "dataL1/assembly"

      - name: Stage metagraph JARs
        run: |
          for layer in l0:ml0 l1:cl1 data_l1:dl1; do
            module="${layer%%:*}"; target="${layer#*:}"
            jar=$(ls -1t modules/${module}/target/scala-2.13/*-assembly*.jar | head -1)
            cp "$jar" tessellation/docker/jars/${target}.jar
            echo "✓ ${target}.jar ($(stat -c%s "$jar") bytes)"
          done
          ls -la tessellation/docker/jars/

      # Pre-stage snapshot-streaming JAR from GitHub Releases to avoid building from source.
      # The snapshot-streaming develop branch targets an older tessellation SDK version and
      # will fail to compile when overridden to match the running cluster's tessellation version.
      # By pre-staging the JAR, build-snapshot-streaming.sh skips the sbt assembly entirely.
      - name: Download snapshot-streaming JAR
        run: |
          SS_JAR_URL=$(curl -sf https://api.github.com/repos/Constellation-Labs/snapshot-streaming/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          SS_JAR_DEST="tessellation/docker/snapshot-streaming/snapshot-streaming.jar"
          echo "Downloading snapshot-streaming JAR: $SS_JAR_URL"
          curl -fL "$SS_JAR_URL" -o "$SS_JAR_DEST"
          echo "✓ snapshot-streaming.jar ($(stat -c%s "$SS_JAR_DEST") bytes)"

      # Start cluster with SKIP_ASSEMBLY since all JARs are pre-staged in docker/jars/.
      # --hypergraph-release sets TESSELLATION_VERSION for the Docker image tag.
      # GITHUB_TOKEN is required: just up builds snapshot-streaming from source (sbt resolves
      # from GitHub Packages), and sbt needs a valid token to authenticate. Without it,
      # sbt fails with "unable to locate a valid GitHub token from Or(GitConfig(github.token),
      # Environment(GITHUB_TOKEN))".
      - name: Start cluster
        working-directory: tessellation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # DL1 data-consensus peers-count = N-1 so EVERY round includes all 3 DL1
          # nodes. Default is 1 (dag-l1.conf), which leaves one node out of each
          # round; its mempool copy lingers and goes stale, producing out-of-order
          # SequenceNumberMismatch updates that sink the all-or-nothing data block
          # for every fiber bundled in it — surfaces as flaky DL1-sync timeouts under
          # parallel load. Inject via the compose-runner's --env passthrough; the
          # dag-l1.conf ${?DATA_PEERS_COUNT} HOCON override reads it.
          printf 'DATA_PEERS_COUNT=2\n' > "${RUNNER_TEMP}/dl1-extra.env"
          # Tighten the DL1 idle snapshot cadence. The data-application L1 fires a TimeTrigger
          # block every time-trigger-interval when below the event-trigger threshold, and each
          # such block drives one ML0 snapshot. Default 43s leaves long idle gaps (measured: ML0
          # ~6.8s avg but with ~45s TimeTrigger stalls) during which a confirmation waits out the
          # gap. Drop to 8s so idle windows produce snapshots ~5x more often — confirmations across
          # EVERY lane land sooner. Read via dag-l1.conf ${?DATA_L1_TIME_TRIGGER_INTERVAL}.
          printf 'DATA_L1_TIME_TRIGGER_INTERVAL=8 seconds\n' >> "${RUNNER_TEMP}/dl1-extra.env"
          # --data (not --cl1): data-only topology (ML0 + DL1, NUM_CL1_NODES=0). The currency L1
          # is not needed — ML0 snapshot consensus is already EventTrigger-driven by DL1 data
          # blocks, so a currency-tx drip would be redundant (and Tessellation's tx mempool does
          # not pipeline unaccepted txs, which deadlocked the drip on Conflict{ordinal}).
          just up --hypergraph-release="v${{ steps.versions.outputs.tessellation }}" \
            --skip-assembly --metagraph="${GITHUB_WORKSPACE}" --dl1 --data \
            --env="${RUNNER_TEMP}/dl1-extra.env"

      - name: Wait for cluster health
        run: |
          wait_for_node() {
            local name=$1 port=$2 max_wait=${3:-120}
            local iterations=$((max_wait / 2))
            for i in $(seq 1 $iterations); do
              if curl -sf "http://localhost:${port}/node/info" 2>/dev/null | grep -q '"state":"Ready"'; then
                echo "  ✓ $name (port $port): Ready"
                return 0
              fi
              sleep 2
            done
            echo "  ✗ $name (port $port): TIMEOUT after ${max_wait}s" && return 1
          }
          
          echo "Waiting for genesis nodes (120s timeout)..."
          wait_for_node "GL0" 9000 120
          wait_for_node "ML0" 9200 120
          wait_for_node "DL1-0" 9400 120
          
          echo ""
          echo "Waiting for DL1 validators (240s timeout - they have join delays)..."
          wait_for_node "DL1-1" 9410 240
          wait_for_node "DL1-2" 9420 240
          
      - name: Verify DL1 cluster size
        run: |
          echo "Verifying DL1 cluster formation..."
          CLUSTER_SIZE=$(curl -s http://localhost:9400/cluster/info | jq 'length' 2>/dev/null || echo "0")
          echo "DL1 cluster size: $CLUSTER_SIZE"
          
          if [ "$CLUSTER_SIZE" -lt 3 ]; then
            echo "::error::DL1 cluster size is $CLUSTER_SIZE (expected 3)"
            curl -s http://localhost:9400/cluster/info | jq . || true
            exit 1
          fi
          echo "✓ DL1 cluster has $CLUSTER_SIZE peers"

      - name: Verify ML0 ordinal progression
        run: |
          echo "Checking ML0 ordinal progression..."
          sleep 10
          ORD1=$(curl -sf http://localhost:9200/snapshots/latest 2>/dev/null | jq -r '.value.ordinal // .ordinal // empty' || echo "")
          if [ -z "$ORD1" ]; then
            echo "::warning::Could not fetch initial ML0 ordinal — skipping progression check"
          else
            echo "  Initial ordinal: $ORD1"
            sleep 30
            ORD2=$(curl -sf http://localhost:9200/snapshots/latest 2>/dev/null | jq -r '.value.ordinal // .ordinal // empty' || echo "")
            echo "  After 30s: $ORD2"
            if [ "$ORD1" = "$ORD2" ]; then
              echo "::warning::Ordinals haven't advanced ($ORD1), retrying after 30s grace period..."
              sleep 30
              ORD3=$(curl -sf http://localhost:9200/snapshots/latest 2>/dev/null | jq -r '.value.ordinal // .ordinal // empty' || echo "")
              echo "  After 60s total: $ORD3"
              if [ "$ORD1" = "$ORD3" ]; then
                echo "::error::ML0 consensus stalled — ordinal stuck at $ORD1 for 60 seconds"
                exit 1
              fi
              echo "  ✓ Ordinals advancing after grace period ($ORD1 → $ORD3)"
            else
              echo "  ✓ Ordinals advancing ($ORD1 → $ORD2)"
            fi
          fi

      - name: Install E2E dependencies
        working-directory: e2e-test
        run: npm ci

      - name: Run E2E tests
        working-directory: e2e-test
        env:
          E2E_CONCURRENCY: ${{ matrix.lane.concurrency }}
          E2E_ORDINAL_THRESHOLD: ${{ matrix.lane.ordinalThreshold }}
          E2E_MAX_RESUBMITS: ${{ matrix.lane.maxResubmits }}
          # Empty for single-signer lanes (runner defaults to 'alice'); set per lane for
          # multi-participant flows that need distinct joiners (staked-oracle-pool quorum).
          E2E_WALLETS: ${{ matrix.lane.wallets }}
        run: npm test -- ${{ matrix.lane.filter }}

      - name: Collect logs and diagnostics on failure
        if: failure() || cancelled()
        run: |
          echo "## 🔍 Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ML0 Cluster Info" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -sf http://localhost:9200/cluster/info 2>/dev/null | jq . >> $GITHUB_STEP_SUMMARY || echo "Failed to fetch" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### GL0 Cluster Info" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -sf http://localhost:9000/cluster/info 2>/dev/null | jq . >> $GITHUB_STEP_SUMMARY || echo "Failed to fetch" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### DL1-0 Cluster Info" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -sf http://localhost:9400/cluster/info 2>/dev/null | jq . >> $GITHUB_STEP_SUMMARY || echo "Failed to fetch" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Container Logs (last 50 lines)" >> $GITHUB_STEP_SUMMARY
          for container in gl0-0 ml0-0 dl1-0; do
            echo "#### $container" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            docker logs "$container" --tail 50 2>&1 >> $GITHUB_STEP_SUMMARY || echo "Container not found" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

          # Save full logs as files for artifact upload
          mkdir -p /tmp/ci-logs
          # Discover the actual container names (gl0-0/ml0-0/cl1-0/dl1-0… — the exact CL1 suffix is
          # unknown) instead of hardcoding, so we always capture every metagraph-layer node's log.
          for container in $(docker ps --format '{{.Names}}'); do
            case "$container" in
              gl0*|ml0*|cl1*|dl1*) docker logs "$container" 2>&1 > "/tmp/ci-logs/${container}.log" || true ;;
            esac
          done

          # Inline ML0 rejection scan so the stuck-confirm reason shows up directly in the run
          # summary (no artifact download needed). The chain logs FailureReason / policy / effect
          # rejections at WARN/ERROR; these are why a DL1-accepted update never confirms at ML0.
          echo "### ML0 rejection scan (last 80 matches)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker logs ml0-0 2>&1 \
            | grep -iE "reject|invalid|policy|failure|fiber|effect|exhaust|denied|unauthor|spawn|nullifier|verify|sigma|gas|guard" \
            | tail -80 >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload node logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.lane.name }}-${{ github.run_number }}
          path: /tmp/ci-logs/
          retention-days: 14

      - name: Cleanup
        if: always()
        working-directory: tessellation
        run: just down || docker compose down -v || true
