name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  # Commit message validation (runs on all PRs and pushes to main/develop)
  validate-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false
          helpURL: 'https://www.conventionalcommits.org/'

  # PR title validation (only on pull_request events)
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          disallowScopes: |
            release
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

  # Code quality: formatting and linting (PRs targeting main and pushes to main only)
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    # contents: write lets the OpenAPI gate auto-commit a regenerated contract to a same-repo PR branch.
    permissions:
      contents: write
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/plugins.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Check formatting (scalafmt)
        run: sbt scalafmtCheckAll

      - name: Check linting (scalafix)
        run: sbt "scalafixAll --check"

      # OpenAPI contract gate + auto-fix in a single regen. The committed contract must match the
      # generator output. On a SAME-REPO pull request, drift is auto-committed to the PR branch — that
      # push re-runs CI and this gate then passes on the synced commit (no drift => no further commit =>
      # no loop). A fork PR (read-only token) or a push to main fails with a manual-regen message.
      - name: Check / sync OpenAPI contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # GenerateOpenApi writes one contract per layer into docs/:
          #   docs/openapi-ml0.{json,yaml} + docs/openapi-dl1.{json,yaml}
          sbt "currencyL0/runMain xyz.kd5ujc.metagraph_l0.openapi.GenerateOpenApi docs"
          SPECS="docs/openapi-ml0.json docs/openapi-ml0.yaml docs/openapi-dl1.json docs/openapi-dl1.yaml"
          if git diff --quiet -- $SPECS; then
            echo "OpenAPI contracts are in sync."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REPO" = "$REPO" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $SPECS
            git commit -m "chore: sync OpenAPI contracts (ml0 + dl1)"
            if git push origin "HEAD:$HEAD_REF"; then
              echo "::notice::OpenAPI contracts drifted; regenerated + committed to the PR branch. CI will re-run and pass."
            else
              echo "::error::OpenAPI contracts are stale and the auto-commit push failed (branch protection or a read-only Actions token). Run: sbt \"currencyL0/runMain xyz.kd5ujc.metagraph_l0.openapi.GenerateOpenApi docs\" and commit them."
              exit 1
            fi
          else
            echo "::error::OpenAPI contracts are stale. Run: sbt \"currencyL0/runMain xyz.kd5ujc.metagraph_l0.openapi.GenerateOpenApi docs\" and commit them."
            exit 1
          fi

  # Unit tests with coverage (PRs targeting main and pushes to main only)
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/plugins.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Run tests with coverage
        run: sbt clean coverage sharedData/test coverageReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./target/scala-2.13/scoverage-report/scoverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Test report summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
